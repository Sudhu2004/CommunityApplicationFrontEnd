<!-- Backdrop -->
<div class="modal-backdrop" (click)="close()">
  <div class="modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title">Create a Group</h2>
      <button class="btn-close" (click)="close()" [disabled]="isSubmitting()">✕</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      @if (error()) {
        <div class="form-error-banner">
          <span>⚠️ {{ error() }}</span>
        </div>
      }

      <div class="form-group">
        <label class="form-label" for="group-name">Group Name <span class="required">*</span></label>
        <input
          id="group-name"
          type="text"
          class="form-input"
          [class.input-error]="nameInput.invalid && (nameInput.dirty || nameInput.touched)"
          placeholder="e.g. Design Enthusiasts"
          [(ngModel)]="name"
          name="name"
          required
          minlength="2"
          maxlength="255"
          #nameInput="ngModel"
          autocomplete="off"
        >
        <div class="form-hint-row">
          @if (nameInput.invalid && (nameInput.dirty || nameInput.touched)) {
            <span class="form-hint error">Name must be between 2 and 255 characters.</span>
          } @else {
            <span class="form-hint">Choose a clear name.</span>
          }
          <span class="char-count">{{ name.length }}/255</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="group-desc">Description <span class="optional">(optional)</span></label>
        <textarea
          id="group-desc"
          class="form-input form-textarea"
          placeholder="What is this group about?"
          [(ngModel)]="description"
          name="description"
          maxlength="1000"
          rows="4">
        </textarea>
        <div class="form-hint-row">
          <span class="form-hint">Max 1000 characters.</span>
          <span class="char-count">{{ description.length }}/1000</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="close()" [disabled]="isSubmitting()">
        Cancel
      </button>
      <button
        class="btn btn-primary"
        (click)="submit()"
        [disabled]="!isValid || isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner"></span> Creating…
        } @else {
          Create Group
        }
      </button>
    </div>

  </div>
</div>
